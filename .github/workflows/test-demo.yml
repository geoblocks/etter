name: "Test demo docker composition"

on:
  workflow_dispatch:
  pull_request:
    types:
      - opened
      - synchronize

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.filter.outputs.changed }}
    steps:
      - uses: actions/checkout@v7
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            changed:
              - demo/**
              - etter/**
              - scripts/**
              - Makefile
              - pyproject.toml
              - uv.lock
              - .github/workflows/test-demo.yml

  run-composition:
    needs:
      - changes
    if: ${{ needs.changes.outputs.changed == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version-file: .python-version
      - name: Install uv
        uses: astral-sh/setup-uv@v7
      - name: Set up env
        run: |
          cp demo/.env.example demo/.env
      - name: Restore data cache
        id: cache-data
        uses: actions/cache/restore@v6
        with:
          path: data/
          key: data-swissnames3d-2025-bdcarto-2025-09-15
      - name: Download data
        id: download-data
        if: steps.cache-data.outputs.cache-hit != 'true'
        run: |
          make download-data
          make download-data-ign
      - name: Save data cache
        if: steps.download-data.outcome == 'success' && steps.cache-data.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: data/
          key: data-swissnames3d-2025-bdcarto-2025-09-15
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Build and run demo composition
        run: |
          docker compose -f demo/docker-compose.yml up --build -d --wait
      - name: Test demo composition
        run: |
          curl -fsS -o /dev/null -w "OK %{url}\n" http://localhost:8000/
          curl -fsS -o /dev/null -w "OK %{url}\n" http://localhost:8000/docs
          curl -fsS -o /dev/null -w "OK %{url}\n" http://localhost:3002/health
      - name: Dump logs on failure
        if: failure()
        run: docker compose -f demo/docker-compose.yml logs
      - name: Tear down demo composition
        if: always()
        run: |
          docker compose -f demo/docker-compose.yml down --volumes
